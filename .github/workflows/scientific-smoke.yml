name: Scientific smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Quick sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra dev --extra quantum

      # The reduced sweep runs all five experiments in well under a minute. The
      # full reproduction takes hours and is not a CI job; this exists to catch a
      # change that breaks the science while leaving the test suite green.
      - name: Run the reduced sweep
        run: uv run python -m foldq.experiments.run_all --quick --output results/ci

      # Checks the run produced usable science, not just files: no nulls in
      # columns that must never be null, metrics inside [0,1], manifest complete,
      # declared row counts matching, and no unrecognised attribution category.
      - name: Validate the sweep
        run: uv run python scripts/validate_run.py results/ci

      # Guards the published evidence itself, so a commit that corrupts or
      # truncates results/full fails here rather than at review time.
      - name: Validate the committed full sweep
        run: uv run python scripts/validate_run.py results/full

      # Re-resolves every DOI against Crossref and fails if one that previously
      # verified stops resolving. Cheap, and it is the only thing standing between
      # a stale citation and a reader who trusts the "verified" label.
      - name: Re-verify the bibliography
        run: uv run python scripts/verify_references.py --check
        continue-on-error: true   # a Crossref outage must not fail the build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-sweep
          path: results/ci
          retention-days: 14
