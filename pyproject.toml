[project]
name = "foldq"
version = "0.1.0"
description = "Explainable hybrid quantum-classical optimization for mRNA secondary-structure prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
    "viennarna>=2.7,<2.8",
    "dimod>=0.12",
    "dwave-samplers>=1.8",
    "networkx>=3.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = ["qiskit>=2.5,<3", "qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
foldq = "foldq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
