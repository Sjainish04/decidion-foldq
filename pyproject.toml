[project]
name = "foldq"
version = "0.1.0"
description = "Explainable hybrid quantum-classical optimization for mRNA secondary-structure prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
    "viennarna>=2.7,<2.8",
    "dimod>=0.12",
    "dwave-samplers>=1.8",
    "networkx>=3.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = ["qiskit>=2.5,<3", "qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    # Required by starlette.testclient.TestClient (used to test the optional api
    # extra below) as of starlette>=1.0, which replaced its httpx dependency with
    # httpx2. Not a runtime dependency of the API itself -- test-only.
    "httpx2>=2.0,<3",
]
# Upper-bounded on purpose. An unbounded `fastapi>=0.115` resolved to 0.141.1 /
# starlette 1.3.1, which swapped TestClient's HTTP client out from under the test
# suite. A judged submission has to install the same way months from now, so this
# extra is bounded like `viennarna` and `qiskit` are.
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "httpx>=0.27,<1"]
# Statistical analysis of the project's own results. Kept out of the `api` extra
# on purpose: the deployed function has a size limit and never runs this code.
analysis = ["scikit-learn>=1.5,<2"]

[project.scripts]
foldq = "foldq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer requires Option()/Argument() calls as parameter defaults; B008 does not
# apply to this idiom.
"src/foldq/cli.py" = ["B008"]
# Capital X for a design matrix and lowercase y for a target is the universal
# convention in statistics and is what scikit-learn's own API uses. Renaming
# these to satisfy a Python naming rule would make the linear algebra harder to
# follow, not easier.
"src/foldq/analysis/drivers.py" = ["N806"]
"src/foldq/analysis/multivariate.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # QAOAAnsatz internally uses NLocal/BlueprintCircuit, deprecated in Qiskit 2.1
    # and slated for removal in Qiskit 3.0. Emitted by Qiskit, not by this project.
    # Our QAOA results reproduce only against the pinned Qiskit 2.5.x.
    "ignore:The class ``qiskit.circuit.library.n_local.*:DeprecationWarning",
    "ignore:The class ``qiskit.circuit.library.blueprintcircuit.*:DeprecationWarning",
    # qiskit_ibm_runtime.fake_provider.FakeProviderForBackendV2.__init__ eagerly
    # constructs all ~60 registered fake backends (its only lookup-by-name path),
    # including FakeNighthawk, whose constructor emits this UserWarning exactly
    # once per process via a module-level guard. It fires the first time any test
    # asks for a fake backend by name -- including fake_hanoi, which is the only
    # one this project actually uses -- and is unrelated to our noise model.
    "ignore:Properties of fake_nighthawk are not intended to represent typical nighthawk error values.:UserWarning",
]
